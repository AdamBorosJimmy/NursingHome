<div class="urlap-kartya">
    <label>Felhasználónév:</label>
    <input type="text" id ="nev-mezo" placeholder="Írd ide a neved">
    <label>Jelszó:</label>
    <input type="password" id="jelszo-mezo" placeholder="Írd ide a jelszavad">
    <label>E-mail:</label>
    <input type="email" id="email-mezo" placeholder="Írd ide az e-mail címed">
    <button id="belépés-gomb">Bejelentkezés</button>
</div>


<script>
     // 1. Megkeressük a gombot az ID-ja alapján és elmentjük egy változóba
    const gomb = document.getElementById('belépés-gomb');
    const emailInput = document.getElementById('email-mezo');
    const passwordInput = document.getElementById('jelszo-mezo');

    // 2. Megmondjuk a gombnak, hogy figyelje a kattintást(click)
    gomb.addEventListener('click', function() {
    const beirtEmail = emailInput.value;
    const beirtJelszo = passwordInput.value;
    // 3. Amikor rákattintanak, akkor felugrik egy üzenetablak
    if(beirtJelszo === "") {
    alert('Hiba! Jelszó mező nem maradhat üresen!')
    } else if (beirtJelszo.length < 6) {
        alert('A beírt jelszó nem megfelelő, mert nincs 6 karakter hoszzú!')
    } else {
    alert('Sikeres bejelentkezés! A beirt e-mail cím: ' + beirtEmail)
    }

    // alert('Sikeresen megnyomtad a Bejelentkezés gombot!');

    });

</script>
